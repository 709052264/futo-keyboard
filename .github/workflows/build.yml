name: Build and Publish arm64 Release APK 

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
        -Dkotlin.daemon.jvm.options="-Xmx3g"
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 👇【新增】：自动下载你的 Rime Ice 词典，放入 assets
      - name: Download Latest Rime Ice Dict
        run: |
          echo "Downloading rime_ice.dict from Repo A latest release..."
          mkdir -p java/assets
          curl -fL -o java/assets/builtin.dict \
            "https://github.com/709052264/FUTO-Keyboard-Chinese-Rime_ice-Dict/releases/latest/download/rime_ice.dict"
          
          echo "Downloaded size:"
          ls -lh java/assets/builtin.dict
          
          if [ $(stat -c%s "java/assets/builtin.dict") -lt 1048576 ]; then
            echo "ERROR: Dictionary too small or download failed!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > my-release.jks

      - name: Build release APK
        run: |
          ./gradlew assembleStableRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/my-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find . -path "*/build/outputs/apk/*" -name "*.apk" -type f -exec cp {} artifacts/ \;
          if [ -z "$(ls -A artifacts)" ]; then echo "NO APK FOUND"; exit 1; fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: futo-keyboard-release
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "FUTO Keyboard Rime-Ice ${{ github.run_number }}"
          files: artifacts/*.apk
